<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script defer src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>TO-DO LIST</title>
</head>

<body>
    <div class="container mt-5">
        <h2>TO-DO LIST</h2>

        <div class="container-general">
            <div class="escribir-tarea mb-3">
                <input class="form-control" id="tarea-texto" type="text" placeholder="Añade una tarea"
                    aria-label="default input example">
                <button type="button" class="btn btn-primary" id="boton-añadir-tarea">Añadir</button>
                <hr>
            </div>
            <div class="lista-tareas">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Tareas</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-tareas">

                    </tbody>
                </table>
            </div>
            <div class="filtros-tarea">
                <button type="button" class="btn btn-secondary" id="todas">Todas</button>
                <button type="button" class="btn btn-secondary" id="completadas">Completadas</button>
                <button type="button" class="btn btn-secondary" id="pendientes">Pendientes</button>
            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
