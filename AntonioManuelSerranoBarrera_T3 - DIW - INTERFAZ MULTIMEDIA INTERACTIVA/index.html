<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="video-fondo">
        <video autoplay loop muted playsinline>
            <source src="video/video_fondo.mp4" type="video/mp4" />
        </video>
    </div>

    <div class="barra-estado">
        <span id="estadoTexto">JOINING SERVER</span>
    </div>

    <div class="reproductor">
        <div class="cont1">
            <div class="textos">
                <div class="cancion-foto"></div>
                <div class="cancion-nombre">Nombre cancion</div>
                <div class="cancion-artista">Nombre artista</div>
            </div>

            <div class="duracion">
                <div class="duracion-actual">00:00</div>
                <input type="range" min="1" max="100" value="0" class="duracion-slider" onchange="duracion()">
                <div class="duracion-total">00:00</div>
            </div>

            <div class="volumen">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" min="1" max="100" value="99" class="volumen-slider" onchange="volumen()">
                <i class="fa-solid fa-volume-high"></i>
            </div>

            <div class="mute-contenedor">
                <button class="btn-mute" onclick="mute()">MUTE</button>
            </div>

            <div class="botones">
                <div class="cancion-anterior" onclick="cancionAnterior()">
                    <i class="fa fa-step-backward fa-2x"></i>
                </div>
                <div class="playpause" onclick="playpause()">
                    <i class="fa fa-play-circle fa-5x"></i>
                </div>
                <div class="siguiente-cancion" onclick="siguienteCancion()">
                    <i class="fa fa-step-forward fa-2x"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- spinner de bootstrap -->
    <div class="icono-cargando">
        <div class="spinner-border" role="status"></div>
    </div>


    <div class="links">
        <a href="https://discord.com/" target="_blank" aria-label="Discord">
            <i class="fa-brands fa-discord"></i>
        </a>
        <a href="https://www.youtube.com/@AndresPerfumeMan" target="_blank" aria-label="YouTube">
            <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://anaaweb.org/realiza-un-donativo" target="_blank" aria-label="Donaciones">
            <i class="fa-solid fa-heart"></i>
        </a>
    </div>

</body>

</html>
