<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>CRUD viajes</title>
</head>

<body>
    <div class="container mt-5">

        <h2>CRUD VIAJES</h2>

        <div class="container-clientes">
            <h3>Clientes</h3>

            <div class="formulario-clientes">

                <div class="nombre-cliente">
                    <label for="nombre-cliente" class="form-label"></label>
                    <input type="text" class="form-control" id="nombre-cliente" placeholder="Nombre">
                </div>

                <div class="apellidos-cliente">
                    <label for="apellidos-cliente" class="form-label"></label>
                    <input type="text" class="form-control" id="apellidos-cliente" placeholder="Apellidos">
                </div>

                <div class="correo-electronico-cliente">
                    <label for="correo-electronico-cliente" class="form-label"></label>
                    <input type="text" class="form-control" id="correo-electronico-cliente"
                        placeholder="Correo electrónico">
                </div>

                <div class="telefono-cliente">
                    <label for="telefono-cliente" class="form-label"></label>
                    <input type="text" class="form-control" id="telefono-cliente" placeholder="Teléfono">
                </div>

                <button type="button" class="btn btn-success" id="boton-añadir-cliente">Añadir cliente</button>

            </div>

            <table class="table">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellidos</th>
                        <th scope="col">Correo electrónico</th>
                        <th scope="col">Teléfono</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-clientes"></tbody>
            </table>

        </div>

        <div class="container-viajes">

            <h3>Viajes</h3>

            <div class="formulario-viajes">

                <div class="codigo-viaje">
                    <label for="codigo-viaje" class="form-label"></label>
                    <input type="text" class="form-control" id="codigo-viaje" placeholder="Código">
                </div>

                <div class="destino-viaje">
                    <label for="destino-viaje" class="form-label"></label>
                    <input type="text" class="form-control" id="destino-viaje" placeholder="Destino">
                </div>

                <div class="precio-viaje">
                    <label for="precio-viaje" class="form-label"></label>
                    <input type="number" class="form-control" id="precio-viaje" placeholder="Precio">
                </div>

                <div class="tipo-viaje">
                    <select class="form-select" id="selector-tipo-viaje">
                        <option selected disabled hidden>Tipo de viaje</option>
                        <option value="Paquete">Paquete</option>
                        <option value="Sin paquete">Sin paquete</option>
                    </select>
                </div>

                <button type="button" class="btn btn-success" id="boton-añadir-viaje">Añadir viaje</button>

            </div>

            <table class="table">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Destino</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-viajes"></tbody>
            </table>

        </div>

        <div class="container-reservas">

            <h3>Reservas</h3>

            <div class="formulario-reservas">

                <div class="selector-clientes">
                    <select class="form-select" aria-label="Default select example" id="selector-cliente-reserva">
                        <option selected selected disabled hidden>Seleccionar cliente</option>
                    </select>
                </div>

                <div class="selector-viajes">
                    <select class="form-select" aria-label="Default select example" id="selector-viaje-reserva">
                        <option selected selected disabled hidden>Seleccionar viaje</option>
                    </select>
                </div>

                <button type="button" class="btn btn-success" id="boton-crear-reserva">Crear Reserva</button>

            </div>

            <table class="table">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Cliente</th>
                        <th scope="col">Viajes</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas"></tbody>
            </table>

        </div>

    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
