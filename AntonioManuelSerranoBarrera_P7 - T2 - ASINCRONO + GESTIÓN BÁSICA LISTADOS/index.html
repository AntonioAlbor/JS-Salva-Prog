<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AJAX Avanzado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="container mt-5">

    <h1 class="mb-4">AJAX con API externa</h1>


    <div id="buscador">
        <!-- Buscador -->
        <input type="text" id="busqueda" class="form-control mb-3" placeholder="Buscar por nombre o email">
    </div>

    <div id="filtros">
        <!-- Ordenación -->
        <select id="orden" class="form-select mb-3">
            <option value="asc">Orden A–Z</option>
            <option value="desc">Orden Z–A</option>
        </select>

        <select id="numero" class="form-select mb-3">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
        </select>

        <button id="recargar" class="btn btn-primary mb-3">
            Recargar
        </button>
    </div>

    <table class="table">
        <thead class="table-dark">
            <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Correo</th>
            </tr>
        </thead>
        <tbody id="tabla">
        </tbody>
    </table>

<div id="spinner">
    <div class="spinner-border" role="status" id="loader">
        <span class="sr-only"></span>
    </div>
</div>


    <!-- Resultados -->
    <div id="resultado"></div>

    <!-- Paginación -->
    <div class="mt-4" id="paginacion">
        <p>Mostrando x resultados de y totales</p>
    </div>

    <div class="mt-4" id="botones">
        <button id="first" class="btn btn-secondary">Ir primera</button>
        <button id="prev" class="btn btn-secondary">Anterior</button>
        <p id="pagina">1</p>
        <button id="next" class="btn btn-secondary">Siguiente</button>
        <button id="last" class="btn btn-secondary">Ir última</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>

</body>

</html>
